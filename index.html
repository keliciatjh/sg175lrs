<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGLRS - Portal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0a0915; color: #f3f4f6; font-family: 'Rajdhani', sans-serif; }
    .neon-border { box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); border: 1px solid rgba(139, 92, 246, 0.4); }
    .neon-text { text-shadow: 0 0 10px rgba(6, 182, 212, 0.6); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900/90 p-8 rounded-2xl neon-border space-y-6">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-purple-600 to-cyan-400 mx-auto flex items-center justify-center font-orbitron font-extrabold text-2xl text-white">
        🐺
      </div>
      <h1 class="font-orbitron font-bold text-2xl text-white tracking-wider neon-text">SG175LRS PORTAL</h1>
      <p class="text-xs text-purple-400">175 Langrensha Game</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="flex border-b border-purple-900/60 font-orbitron text-sm">
      <button onclick="toggleForm('login')" id="tab-login" class="w-1/2 py-2 text-cyan-400 border-b-2 border-cyan-400 font-bold">Login</button>
      <button onclick="toggleForm('register')" id="tab-register" class="w-1/2 py-2 text-gray-400 font-semibold">Register New User</button>
    </div>

    <!-- Alert / Message Box -->
    <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-semibold text-center"></div>

    <!-- LOGIN FORM -->
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">User ID / Player Handle</label>
        <input type="text" id="loginId" required placeholder="e.g. WolfMaster99" class="w-full bg-slate-950 border border-purple-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">4-Digit PIN Code</label>
        <input type="password" id="loginPin" maxlength="4" pattern="\d{4}" required placeholder="••••" class="w-full bg-slate-950 border border-purple-800 rounded-lg px-4 py-2 text-white tracking-widest text-center text-lg focus:outline-none focus:border-cyan-400">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 text-white font-orbitron font-bold py-3 rounded-lg text-sm transition shadow-lg">
        Enter Game Hub ➔
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Choose User ID / Player Handle</label>
        <input type="text" id="regId" required placeholder="e.g. SeerQueen" class="w-full bg-slate-950 border border-purple-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-400 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Create 4-Digit PIN Code</label>
        <input type="password" id="regPin" maxlength="4" pattern="\d{4}" required placeholder="••••" class="w-full bg-slate-950 border border-purple-800 rounded-lg px-4 py-2 text-white tracking-widest text-center text-lg focus:outline-none focus:border-cyan-400">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white font-orbitron font-bold py-3 rounded-lg text-sm transition shadow-lg">
        Create Account
      </button>
    </form>

  </div>

  <script>
    // Initialize default preset users if none exist in LocalStorage
    function getStoredUsers() {
      const stored = localStorage.getItem('sglrs_users');
      if (!stored) {
        // Preset default accounts
        const defaults = {
          "admin": "1234",
          "player1": "0000"
        };
        localStorage.setItem('sglrs_users', JSON.stringify(defaults));
        return defaults;
      }
      return JSON.parse(stored);
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `p-3 rounded-lg text-xs font-semibold text-center ${
        isSuccess ? 'bg-emerald-950 border border-emerald-700 text-emerald-300' : 'bg-rose-950 border border-rose-700 text-rose-300'
      }`;
      box.classList.remove('hidden');
    }

    function toggleForm(mode) {
      const isLogin = mode === 'login';
      document.getElementById('form-login').classList.toggle('hidden', !isLogin);
      document.getElementById('form-register').classList.toggle('hidden', isLogin);
      
      document.getElementById('tab-login').className = isLogin 
        ? 'w-1/2 py-2 text-cyan-400 border-b-2 border-cyan-400 font-bold' 
        : 'w-1/2 py-2 text-gray-400 font-semibold';
      document.getElementById('tab-register').className = !isLogin 
        ? 'w-1/2 py-2 text-cyan-400 border-b-2 border-cyan-400 font-bold' 
        : 'w-1/2 py-2 text-gray-400 font-semibold';
      
      document.getElementById('alertBox').classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const userId = document.getElementById('loginId').value.trim();
      const pin = document.getElementById('loginPin').value.trim();
      
      const users = getStoredUsers();

      if (users[userId] && users[userId] === pin) {
        // Save current session state
        sessionStorage.setItem('sglrs_active_user', userId);
        showAlert('Login successful! Redirecting...', true);
        
        // Redirect to second page (dashboard.html)
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        showAlert('Invalid User ID or PIN code.');
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const userId = document.getElementById('regId').value.trim();
      const pin = document.getElementById('regPin').value.trim();

      const users = getStoredUsers();

      if (users[userId]) {
        showAlert('User ID already exists! Please choose another.');
        return;
      }

      // Save new user credentials
      users[userId] = pin;
      localStorage.setItem('sglrs_users', JSON.stringify(users));

      showAlert('Account created! You can now log in.', true);
      setTimeout(() => toggleForm('login'), 1200);
    }
  </script>

</body>
</html>
