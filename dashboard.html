<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGLRS - Game Hub Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0a0915; color: #f3f4f6; font-family: 'Rajdhani', sans-serif; }
    .neon-border { box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); border: 1px solid rgba(139, 92, 246, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-purple-900/50 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🐺</span>
        <h1 class="font-orbitron font-bold text-xl text-white">SGLRS GAME DASHBOARD</h1>
      </div>
      <div class="flex items-center space-x-4">
        <span class="text-xs text-purple-300">Welcome, <strong id="activeUserDisplay" class="text-cyan-400">User</strong></span>
        <button onclick="handleLogout()" class="bg-rose-800 hover:bg-rose-700 text-white text-xs px-3 py-1.5 rounded font-orbitron font-bold transition">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Dashboard Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="bg-slate-900 p-8 rounded-2xl neon-border space-y-4">
      <h2 class="font-orbitron text-2xl font-bold text-cyan-400">Member Game Room</h2>
      <p class="text-gray-300 text-sm">You have successfully logged in using your PIN code!</p>
      
      <div class="p-4 bg-purple-950/40 border border-purple-800 rounded-lg text-xs space-y-2">
        <p class="text-purple-300 font-bold">🔐 Session Authenticated</p>
        <p class="text-gray-400">This area is protected. If anyone tries to access <code>dashboard.html</code> directly without logging in, they will automatically be redirected back to <code>index.html</code>.</p>
      </div>
    </div>
  </main>

  <!-- Script Security Check -->
  <script>
    // Check if user has an active login session
    const activeUser = sessionStorage.getItem('sglrs_active_user');

    if (!activeUser) {
      // Redirect unauthenticated users back to login
      alert("Access denied. Please log in first.");
      window.location.href = "index.html";
    } else {
      document.getElementById('activeUserDisplay').textContent = activeUser;
    }

    function handleLogout() {
      sessionStorage.removeItem('sglrs_active_user');
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
